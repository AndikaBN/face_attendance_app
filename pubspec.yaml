name: face_attendance_app
description: "Aplikasi absensi mahasiswa dengan face recognition"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0

  # Networking
  dio: ^5.7.0

  # Camera
  camera: ^0.11.0+2

  # Face Detection (local, on-device)
  google_mlkit_face_detection: ^0.12.0

  # Permissions
  permission_handler: ^11.3.1

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.5.0

  # Utilities
  intl: ^0.19.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
